[project]
name = "soyshop-mcp"
version = "0.1.0"
description = "MCP server for SOY Shop catalog operations via soyshop_bridge plugin (read + draft-write + open/close)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
soyshop-mcp = "soyshop_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soyshop_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
