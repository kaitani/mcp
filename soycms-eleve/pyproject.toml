[project]
name = "soycms-mcp"
version = "0.1.0"
description = "MCP server for SOY CMS (eleve-organic.jp) - read + draft-write via output_blog_entries_json + eleve_bridge"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
soycms-mcp = "soycms_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soycms_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
